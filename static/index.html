<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Сервис</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <header class="header">
            <h1>🧗‍♂️ Альпинист</h1>
            <p>Мытьё окон и балконов</p>
        </header>

        <!-- Карточки меню -->
        <div class="menu-grid">
            <div class="card" id="register-card">
                <div class="card-icon">📝</div>
                <div class="card-title">Регистрация</div>
                <div class="card-subtitle">Привяжите квартиру</div>
            </div>
            <div class="card" id="new-request-card">
                <div class="card-icon">🪟</div>
                <div class="card-title">Новая заявка</div>
                <div class="card-subtitle">Заказать мытьё</div>
            </div>
            <div class="card" id="my-requests-card">
                <div class="card-icon">📋</div>
                <div class="card-title">Мои заявки</div>
                <div class="card-subtitle">Статусы и история</div>
            </div>
        </div>

        <!-- Контент -->
        <div id="content" class="content"></div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
